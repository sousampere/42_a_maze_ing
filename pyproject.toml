[project]
name = "mazegen"
version = "0.2.0"
description = "A-Maze-Ing project from School 42, by gtourdia and lbonnnet"
readme = "README.md"
requires-python = "==3.13.1"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pydantic>=2.12.5",
    "pynput>=1.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mazegen"]
